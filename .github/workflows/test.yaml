name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# The devcontainer CLI version Foreman pins, so CI builds features the way
# Foreman environments do.
env:
  DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "orca: installer unit tests"
        run: bash test/orca/unit/test-orca-install.sh

  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - orca
        baseImage:
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: "Testing '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: npx --yes "$DEVCONTAINER_CLI" features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - orca
    steps:
      - uses: actions/checkout@v4
      - name: "Testing '${{ matrix.features }}' scenarios"
        run: npx --yes "$DEVCONTAINER_CLI" features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  test-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "orca: compose-based devcontainer"
        run: DEVCONTAINER_CLI="npx --yes $DEVCONTAINER_CLI" scripts/test-compose.sh
